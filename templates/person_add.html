{% extends "layout.html" %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h3 class="mb-0">

                <i class="bi bi-person-plus-fill"></i>

                Tambah Person

            </h3>

            <small class="text-muted">

                Tambahkan data person dan akun employee baru.

            </small>

        </div>

        <a
            href="/persons"
            class="btn btn-secondary">

            <i class="bi bi-arrow-left"></i>

            Kembali

        </a>

    </div>

    <div class="row g-4">

        <!-- Form -->

        <div class="col-lg-7">

            <div class="card shadow">

                <div class="card-header">

                    Informasi Person

                </div>

                <div class="card-body">

                    <div class="mb-3">

                        <label>ID Person</label>

                        <input
                            id="personID"
                            class="form-control"
                            readonly>

                    </div>

                    <div class="mb-3">

                        <label>Nama</label>

                        <input
                            id="personName"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Jenis Kelamin</label>

                        <select
                            id="personGender"
                            class="form-select">

                            <option>Laki-laki</option>
                            <option>Perempuan</option>

                        </select>

                    </div>

                    <div class="mb-3">
                        <label>Divisi</label>
                        <input
                            id="personDivision"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input
                            id="personEmail"
                            type="email"
                            class="form-control"
                            placeholder="untuk fitur lupa password">
                    </div>

                    <div class="mb-3">
                        <label>Username</label>
                        <input
                            id="personUsername"
                            class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        <input
                            id="personPassword"
                            type="password"
                            class="form-control">
                    </div>


                    </div>

                    <button
                        id="btnSavePerson"
                        class="btn btn-success w-100">

                        Simpan Person

                    </button>

                </div>

            </div>

        </div>


</div>

{% endblock %}

{% block scripts %}

<script src="{{ url_for('static', filename='js/person_add.js') }}"></script>

{% endblock %}
