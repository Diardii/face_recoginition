<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lengkapi Email | FACE AI</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Main Style -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body.auth-page {

            min-height: 100vh;

            margin: 0;

            font-family: "Segoe UI", sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(161, 140, 209, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(251, 194, 235, 0.35),
                    transparent 35%
                ),
                #edf1f5;

        }


        .auth-card {

            width: 100%;

            max-width: 420px;

            padding: 45px 40px;

            border-radius: 26px;

            background: rgba(255, 255, 255, 0.85);

            border: 1px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 25px 70px rgba(45, 35, 80, 0.16);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

        }


        .auth-icon {

            width: 58px;

            height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 22px;

            border-radius: 18px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #A18CD1,
                    #FBC2EB
                );

            box-shadow:
                0 10px 25px rgba(161, 140, 209, 0.3);

            font-size: 24px;

        }


        .auth-title {

            margin-bottom: 8px;

            font-size: 26px;

            font-weight: 700;

            color: #252336;

        }


        .auth-subtitle {

            margin-bottom: 28px;

            color: #7b7888;

            font-size: 13.5px;

            line-height: 1.6;

        }


        .input-group-custom {

            position: relative;

            margin-bottom: 20px;

        }


        .input-icon {

            position: absolute;

            left: 17px;

            top: 50%;

            transform: translateY(-50%);

            z-index: 5;

            color: #9993aa;

            font-size: 17px;

        }


        .auth-input {

            width: 100%;

            height: 54px;

            padding: 0 48px;

            border: 1px solid #e5e1eb;

            border-radius: 14px;

            outline: none;

            background: #ffffff;

            color: #292638;

            font-size: 14px;

            transition: all 0.25s ease;

        }


        .auth-input:focus {

            border-color: #A18CD1;

            box-shadow:
                0 0 0 4px rgba(161, 140, 209, 0.12);

        }


        .auth-button {

            width: 100%;

            height: 54px;

            margin-top: 5px;

            border: none;

            border-radius: 14px;

            color: white;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 0.3px;

            background:
                linear-gradient(
                    135deg,
                    #A18CD1,
                    #FBC2EB
                );

            box-shadow:
                0 8px 22px rgba(161, 140, 209, 0.28);

            transition: all 0.25s ease;

        }


        .auth-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 28px rgba(161, 140, 209, 0.38);

        }


        .auth-error {

            display: flex;

            align-items: flex-start;

            gap: 9px;

            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 12px;

            color: #842029;

            background: #f8d7da;

            font-size: 13px;

            line-height: 1.5;

        }


        .skip-note {

            display: block;

            margin-top: 18px;

            text-align: center;

            color: #9a96a4;

            font-size: 11.5px;

            line-height: 1.6;

        }

    </style>

</head>


<body class="auth-page">


<div class="auth-card">

    <div class="auth-icon">
        <i class="bi bi-envelope-plus"></i>
    </div>

    <h2 class="auth-title">Wait!</h2>
    <h2 class="auth-title">Lengkapi Email Anda</h2>

    <p class="auth-subtitle">
        Akun Anda belum memiliki email terdaftar.
        Email diperlukan agar Anda bisa menggunakan
        fitur "Lupa Password" di kemudian hari. 
    </p>


    {% if error %}

    <div class="auth-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ error }}</span>
    </div>

    {% endif %}


    <form method="POST">

        <div class="input-group-custom">

            <i class="bi bi-envelope input-icon"></i>

            <input
                type="email"
                name="email"
                class="auth-input"
                placeholder="Alamat email Anda"
                autocomplete="email"
                required
                autofocus
            >

        </div>

        <button type="submit" class="auth-button">
            <i class="bi bi-check2 me-2"></i>
            Simpan & Lanjutkan
        </button>

    </form>


    <span class="skip-note">
        Data ini hanya digunakan untuk reset password,
        tidak dibagikan ke pihak lain. Terima kasih :D
    </span>

</div>


</body>

</html>
